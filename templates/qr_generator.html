{% extends "base.html" %}

{% block content %}

<section class="tool-page">

    <div class="tool-container">

        <h1>QR Generator</h1>

        <p>Create stylish QR codes instantly</p>

        <form
            action="/generate-qr"
            method="POST"
        >

            <input
                type="text"
                name="qr_text"
                placeholder="Enter text or URL"
                required
            >

            <button type="submit">
                Generate QR
            </button>

        </form>

    </div>

</section>

{% endblock %}
