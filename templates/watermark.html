{% extends "base.html" %}

{% block content %}

<section class="tool-page">

    <div class="tool-container">

        <h1>Watermark Tool</h1>

        <p>Add custom watermark to images</p>

        <form
            action="/add-watermark"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="image"
                required
            >

            <input
                type="text"
                name="watermark"
                placeholder="Enter watermark text"
                required
            >

            <button type="submit">
                Add Watermark
            </button>

        </form>

    </div>

</section>

{% endblock %}
