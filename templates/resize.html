{% extends 'base.html' %}

{% block content %}

<div class="tool-page">

<h1>📐 Resize Images</h1>

<form
action="/resize-image"
method="POST"
enctype="multipart/form-data"
class="tool-form"
>

<input
type="file"
name="image"
required
>

<input
type="number"
name="width"
placeholder="Width"
required
>

<input
type="number"
name="height"
placeholder="Height"
required
>

<button>
Resize Image
</button>

</form>

</div>

{% endblock %}
